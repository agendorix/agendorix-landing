<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>A gente configura sua agenda · Agendorix</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d1b3e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: white; padding: 24px; box-sizing: border-box; }
  .card { max-width: 420px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: rgba(255,255,255,0.65); line-height: 1.6; margin: 0 0 24px; }
  a.btn { display: inline-block; background: #25D366; color: white; font-weight: 700; padding: 14px 24px; border-radius: 10px; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>🛠️ A gente configura sua agenda</h1>
  <p>Abrindo o WhatsApp… Manda sua lista de serviços e horários que a gente deixa sua agenda pronta pra você.</p>
  <a class="btn" id="waBtn" href="#">Abrir o WhatsApp</a>
</div>
<script>
  // Link da mensagem automática: registra o pedido (setup_requested_at) e abre o WhatsApp.
  var BACKEND_URL = 'https://agendorix-production.up.railway.app';
  var WA_URL = 'https://wa.me/5519971217637?text=' + encodeURIComponent('Oi! Quero que configurem minha agenda no Agendorix. Meu negócio é: ');
  document.getElementById('waBtn').href = WA_URL;
  var t = new URLSearchParams(location.search).get('t');
  var go = function () { location.replace(WA_URL); };
  if (t && /^[0-9a-f]{52}$/.test(t)) {
    fetch(BACKEND_URL + '/public/setup-request/' + t, { method: 'POST', keepalive: true })
      .catch(function () {}).then(go);
    setTimeout(go, 2500); // não deixa a pessoa esperando se o servidor demorar
  } else {
    go();
  }
</script>
</body>
</html>
