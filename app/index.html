<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baixar o app Agendorix</title>
<meta name="robots" content="noindex">
<script>
  // QR code da tela final do /signup aponta pra cá: manda cada celular pra sua loja.
  (function () {
    var ua = navigator.userAgent || '';
    if (/Android/i.test(ua)) {
      // Abre direto o app da Play Store; sem ele, o Chrome cai na versão web (browser_fallback_url).
      location.replace('intent://details?id=com.agendorix.app#Intent;scheme=market;package=com.android.vending;' +
        'S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=com.agendorix.app') + ';end');
    } else if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
      location.replace('https://apps.apple.com/br/app/agendorix/id6770764759');
    }
  })();
</script>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f7fb; color: #0f172a; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 18px; padding: 32px 24px; max-width: 360px; width: calc(100% - 32px); text-align: center; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { font-size: 15px; color: #475569; margin: 0 0 20px; line-height: 1.5; }
  a { display: block; padding: 14px; border-radius: 12px; background: #0f172a; color: #fff; text-decoration: none; font-weight: 700; margin-top: 10px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Baixe o app Agendorix</h1>
    <p>Escolha a loja do seu celular:</p>
    <a href="https://play.google.com/store/apps/details?id=com.agendorix.app">▶ Google Play (Android)</a>
    <a href="https://apps.apple.com/br/app/agendorix/id6770764759">🍎 App Store (iPhone)</a>
  </div>
</body>
</html>
